name: Bug report
description: Report a reproducible problem with the application.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Remove names, profile URLs, messages, cookies, and other personal data before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start the app
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Automated browser
      options:
        - Brave
        - Chrome
        - Edge
        - Chromium
        - Firefox
        - Other or unknown
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node.js version.
      placeholder: macOS 15, Node.js 22
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste only logs that contain no personal information or session data.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all personal information, credentials, cookies, and real LinkedIn profile details.
          required: true
